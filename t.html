<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kamera HD Fullscreen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Container Kamera Full Screen */
        #camera-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Video Preview */
        video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Memastikan full layar tanpa garis hitam */
            transition: transform 0.3s ease;
        }

        /* Efek cermin khusus kamera depan */
        .mirror {
            transform: scaleX(-1);
        }

        /* Efek Flash Layar saat menjepret */
        #flash-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 20;
        }

        /* UI Kontrol Atas */
        .top-controls {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .badge-hd {
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(5px);
        }

        #rec-timer {
            display: none;
            background: rgba(255, 0, 0, 0.8);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: 0.5; }
        }

        /* UI Kontrol Bawah */
        .bottom-controls {
            position: fixed;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            gap: 20px;
        }

        /* Mode Switcher (Foto / Video) */
        .mode-switch {
            display: flex;
            gap: 20px;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 18px;
            border-radius: 25px;
            backdrop-filter: blur(5px);
        }

        .mode-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .mode-btn.active {
            color: #ffd700;
        }

        /* Tombol Utama */
        .action-bar {
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 30px;
        }

        /* Preview Hasil Foto Terakhir */
        #preview-thumb {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #fff;
            background: rgba(255, 255, 255, 0.2);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        #preview-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        /* Tombol Shutter */
        #shutter-btn {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: 4px solid #fff;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s;
        }

        #shutter-btn:active {
            transform: scale(0.92);
        }

        #shutter-inner {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #fff;
            transition: all 0.2s ease;
        }

        /* Gaya saat mode video / merekam */
        .video-mode #shutter-inner {
            background: #ff3b30;
        }

        .recording #shutter-inner {
            width: 30px;
            height: 30px;
            border-radius: 6px;
        }

        /* Tombol Putar Kamera */
        #switch-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        /* Pesan Error jika izin ditolak / bukan HTTPS */
        #error-msg {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.9);
            color: #fff;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            width: 85%;
            z-index: 30;
            border: 1px solid #444;
        }

        /* Modal Preview Full */
        #modal-preview {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 50;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #modal-preview img, #modal-preview video {
            max-width: 100%;
            max-height: 85%;
            object-fit: contain;
        }

        .modal-actions {
            position: fixed;
            bottom: 25px;
            display: flex;
            gap: 20px;
        }

        .btn-modal {
            padding: 10px 24px;
            border-radius: 25px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-close { background: #333; color: #fff; }
        .btn-download { background: #ffd700; color: #000; }
    </style>
</head>
<body>

    <div id="flash-effect"></div>

    <div id="camera-container">
        <!-- atribut playsinline, autoplay, muted wajib agar tidak blackscreen di HP -->
        <video id="video" playsinline autoplay muted></video>
    </div>

    <div class="top-controls">
        <div class="badge-hd">HD 1080P</div>
        <div id="rec-timer">00:00</div>
        <div style="width: 60px;"></div>
    </div>

    <div class="bottom-controls">
        <div class="mode-switch">
            <button class="mode-btn active" id="mode-photo">FOTO</button>
            <button class="mode-btn" id="mode-video">VIDEO</button>
        </div>

        <div class="action-bar">
            <div id="preview-thumb" title="Lihat Hasil">
                <img id="thumb-img" src="" alt="Preview">
            </div>

            <button id="shutter-btn">
                <div id="shutter-inner"></div>
            </button>

            <button id="switch-btn" title="Ganti Kamera">🔄</button>
        </div>
    </div>

    <div id="error-msg">
        <h3>Kamera Tidak Dapat Diakses</h3>
        <p id="error-detail" style="margin-top: 10px; font-size: 13px; color: #ccc;"></p>
        <button onclick="startCamera()" style="margin-top: 15px; padding: 8px 20px; border-radius: 20px; border: none; background: #ffd700; font-weight: bold;">Coba Lagi</button>
    </div>

    <!-- Modal untuk melihat hasil foto/video -->
    <div id="modal-preview">
        <img id="modal-img" style="display: none;">
        <video id="modal-vid" controls style="display: none;"></video>
        <div class="modal-actions">
            <button class="btn-modal btn-close" onclick="closeModal()">Tutup</button>
            <button class="btn-modal btn-download" id="download-btn">Simpan</button>
        </div>
    </div>

    <!-- Canvas tersembunyi untuk menangkap foto jernih -->
    <canvas id="canvas" style="display: none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const shutterBtn = document.getElementById('shutter-btn');
        const switchBtn = document.getElementById('switch-btn');
        const modePhotoBtn = document.getElementById('mode-photo');
        const modeVideoBtn = document.getElementById('mode-video');
        const flashEffect = document.getElementById('flash-effect');
        const thumbImg = document.getElementById('thumb-img');
        const previewThumb = document.getElementById('preview-thumb');
        const errorMsg = document.getElementById('error-msg');
        const errorDetail = document.getElementById('error-detail');
        const recTimer = document.getElementById('rec-timer');

        let currentStream = null;
        let facingMode = 'environment'; // 'environment' = belakang, 'user' = depan
        let currentMode = 'photo'; // 'photo' atau 'video'
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let timerInterval = null;
        let lastMediaUrl = null;
        let lastMediaType = null;

        // Fungsi mematikan stream lama sebelum ganti kamera (Mencegah Black Screen)
        function stopStream() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => {
                    track.stop();
                });
                currentStream = null;
            }
        }

        // Memulai Kamera dengan Resolusi Tinggi
        async function startCamera() {
            errorMsg.style.display = 'none';
            stopStream();

            // Constraint agar kamera jernih (Ideal 1080p, otomatis turun jika HP tidak kuat agar tidak error)
            const constraints = {
                audio: currentMode === 'video', // Minta izin mic hanya jika mode video atau saat perlu
                video: {
                    facingMode: { ideal: facingMode },
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                }
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;

                // Atur efek mirror jika kamera depan
                if (facingMode === 'user') {
                    video.classList.add('mirror');
                } else {
                    video.classList.remove('mirror');
                }

                // Pastikan video benar-benar play
                video.onloadedmetadata = () => {
                    video.play().catch(e => console.error("Auto-play dicegah:", e));
                };

            } catch (err) {
                console.error("Error kamera:", err);
                // Fallback jika resolusi 1080p ditolak perangkat
                try {
                    currentStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: facingMode },
                        audio: false
                    });
                    video.srcObject = currentStream;
                    video.play();
                } catch (fallbackErr) {
                    errorMsg.style.display = 'block';
                    errorDetail.innerText = "Pastikan izin kamera aktif dan halaman dibuka lewat HTTPS atau Localhost. (" + fallbackErr.message + ")";
                }
            }
        }

        // Ganti Kamera Depan / Belakang
        switchBtn.addEventListener('click', () => {
            if (isRecording) return;
            facingMode = (facingMode === 'environment') ? 'user' : 'environment';
            startCamera();
        });

        // Pindah Mode Foto / Video
        modePhotoBtn.addEventListener('click', () => {
            if (isRecording) return;
            currentMode = 'photo';
            modePhotoBtn.classList.add('active');
            modeVideoBtn.classList.remove('active');
            shutterBtn.classList.remove('video-mode');
        });

        modeVideoBtn.addEventListener('click', async () => {
            if (isRecording) return;
            currentMode = 'video';
            modeVideoBtn.classList.add('active');
            modePhotoBtn.classList.remove('active');
            shutterBtn.classList.add('video-mode');
            // Restart stream dengan audio agar video ada suaranya
            await startCamera();
        });

        // Tombol Shutter (Jepret Foto atau Rekam Video)
        shutterBtn.addEventListener('click', () => {
            if (currentMode === 'photo') {
                takePhoto();
            } else {
                toggleVideoRecording();
            }
        });

        // Fungsi Ambil Foto Jernih (Sesuai Resolusi Asli Sensor Video)
        function takePhoto() {
            if (!currentStream) return;

            // Efek Flash Putih
            flashEffect.style.opacity = '0.8';
            setTimeout(() => { flashEffect.style.opacity = '0'; }, 100);

            // Set ukuran canvas sesuai resolusi asli video (bukan ukuran layar) agar jernih!
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');

            // Jika kamera depan, balik gambar di canvas agar hasil foto tidak terbalik
            if (facingMode === 'user') {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Kualitas JPEG 0.95 (Sangat Jernih)
            const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
            
            lastMediaUrl = dataUrl;
            lastMediaType = 'photo';
            thumbImg.src = dataUrl;
            thumbImg.style.display = 'block';
        }

        // Fungsi Rekam Video
        function toggleVideoRecording() {
            if (!isRecording) {
                recordedChunks = [];
                // Cek format video yang didukung browser
                const options = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') 
                    ? { mimeType: 'video/webm;codecs=vp9' } 
                    : { mimeType: 'video/webm' };

                try {
                    mediaRecorder = new MediaRecorder(currentStream, options);
                } catch (e) {
                    mediaRecorder = new MediaRecorder(currentStream);
                }

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    lastMediaUrl = URL.createObjectURL(blob);
                    lastMediaType = 'video';
                    
                    // Ambil thumbnail dari frame terakhir
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    thumbImg.src = canvas.toDataURL('image/jpeg', 0.7);
                    thumbImg.style.display = 'block';
                };

                mediaRecorder.start();
                isRecording = true;
                shutterBtn.classList.add('recording');
                startTimer();
            } else {
                mediaRecorder.stop();
                isRecording = false;
                shutterBtn.classList.remove('recording');
                stopTimer();
            }
        }

        // Timer Rekaman
        function startTimer() {
            let seconds = 0;
            recTimer.style.display = 'block';
            recTimer.innerText = '00:00';
            timerInterval = setInterval(() => {
                seconds++;
                const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
                const secs = String(seconds % 60).padStart(2, '0');
                recTimer.innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            recTimer.style.display = 'none';
        }

        // Buka Modal Preview Hasil
        previewThumb.addEventListener('click', () => {
            if (!lastMediaUrl) return;
            const modal = document.getElementById('modal-preview');
            const modalImg = document.getElementById('modal-img');
            const modalVid = document.getElementById('modal-vid');

            modal.style.display = 'flex';
            if (lastMediaType === 'photo') {
                modalImg.src = lastMediaUrl;
                modalImg.style.display = 'block';
                modalVid.style.display = 'none';
            } else {
                modalVid.src = lastMediaUrl;
                modalVid.style.display = 'block';
                modalImg.style.display = 'none';
            }
        });

        function closeModal() {
            document.getElementById('modal-preview').style.display = 'none';
            document.getElementById('modal-vid').pause();
        }

        // Tombol Simpan / Download
        document.getElementById('download-btn').addEventListener('click', () => {
            if (!lastMediaUrl) return;
            const a = document.createElement('a');
            a.href = lastMediaUrl;
            a.download = lastMediaType === 'photo' 
                ? `FOTO_${Date.now()}.jpg` 
                : `VIDEO_${Date.now()}.webm`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });

        // Jalankan kamera otomatis saat halaman dibuka
        window.addEventListener('load', startCamera);
    </script>
</body>
</html>
