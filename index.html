<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SANZ MARKET</title>
  <style>
    :root {
      --red-700: #8b0b12;
      --red-500: #e11d2e;
      --red-300: #ff6b76;
      --gold: #f5d78e;
      --text: #fff5f5;
      --muted: #d9b3b6;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 10%, rgba(225, 29, 46, 0.35), transparent 45%),
        radial-gradient(circle at 80% 90%, rgba(139, 11, 18, 0.45), transparent 50%),
        linear-gradient(160deg, #0d0002 0%, #1a0205 50%, #000 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 48px 32px;
      border-radius: 24px;
      text-align: center;
      background: linear-gradient(145deg, rgba(255,255,255,0.06), rgba(255,255,255,0.01));
      border: 1px solid rgba(255, 107, 118, 0.25);
      backdrop-filter: blur(14px);
      box-shadow: 0 30px 80px rgba(225, 29, 46, 0.25), inset 0 1px 0 rgba(255,255,255,0.08);
      animation: rise 0.9s ease both;
    }

    .badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold);
      border: 1px solid rgba(245, 215, 142, 0.4);
      background: rgba(245, 215, 142, 0.08);
      margin-bottom: 24px;
    }

    .logo {
      display: block;
      width: 180px;
      max-width: 100%;
      height: auto;
      margin: 0 auto 22px;
      border-radius: 18px;
      object-fit: contain;
      box-shadow: 0 0 0 1px rgba(245, 215, 142, 0.15);
      filter: drop-shadow(0 0 18px rgba(225, 29, 46, 0.55));
      animation: pulse 2.4s ease-in-out infinite;
    }

    h1 {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #fff, var(--red-300), #fff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      background-size: 200% auto;
      animation: shine 4s linear infinite;
    }

    .desc {
      margin: 14px 0 30px;
      font-size: 15px;
      line-height: 1.6;
      color: var(--muted);
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 17px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(135deg, var(--red-500), var(--red-700));
      box-shadow: 0 12px 30px rgba(225, 29, 46, 0.45);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .btn::after {
      content: "";
      position: absolute;
      top: 0; left: -75%;
      width: 50%; height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255,255,255,0.35), transparent);
      transform: skewX(-20deg);
      animation: sweep 3s infinite;
    }

    .btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 18px 40px rgba(225, 29, 46, 0.65);
    }

    .note {
      margin-top: 18px;
      font-size: 12px;
      color: rgba(217, 179, 182, 0.7);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { filter: drop-shadow(0 0 12px rgba(225,29,46,0.4)); }
      50% { filter: drop-shadow(0 0 28px rgba(225,29,46,0.8)); }
    }
    @keyframes shine {
      to { background-position: 200% center; }
    }
    @keyframes sweep {
      0% { left: -75%; }
      60%, 100% { left: 125%; }
    }

    @media (max-width: 480px) {
      .card { padding: 36px 22px; }
      h1 { font-size: 25px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">SANZ MARKET</span>
    <img class="logo" src="logo.jpg" alt="">
    <h1>SANZ MARKET</h1>
    <p class="desc">Gabung saluran WhatsApp SANZ MARKET untuk update terbaru dan info eksklusif.</p>

    <a class="btn" href="https://whatsapp.com/channel/0029Vb97k4mF6smvrU08PT3y" target="_blank" rel="noopener">
      Gabung Saluran WhatsApp
    </a>
    <p class="note">Gratis bergabung • Bisa keluar kapan saja</p>
  </main>
</body>
</html>
